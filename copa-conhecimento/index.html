<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copa do Conhecimento - Quiz das Seleções</title>
<style>
  html,body{background:transparent !important; height:auto !important; margin:0; padding:0;}

  #pde-painel{
    --azul:#0f2c4a;
    --verde:#1a6b2a;
    --cyan:#37b1da;
    --lime:#b6d752;
    --gramado:#15683a;
    --gramado-claro:#1d864a;
    --branco:#ffffff;
    --cinza:#e8edf2;
    --cinza-txt:#5a6b7a;
    --erro:#d64545;
    --gol:#1a6b2a;
    --sombra:0 6px 24px rgba(15,44,74,.16);
    --raio:16px;
    font-family:'Segoe UI',Roboto,sans-serif;
    color:var(--azul);
    max-width:880px;
    margin:0 auto;
    padding:8px 14px 28px;
    box-sizing:border-box;
  }
  #pde-painel *{box-sizing:border-box;}

  /* ===== CABEÇALHO ===== */
  #pde-painel .pde-topo{
    text-align:center;
    padding:18px 12px 14px;
    background:linear-gradient(135deg,var(--azul) 0%,#1a4a7a 100%);
    border-radius:var(--raio);
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  #pde-painel .pde-topo::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.04) 46px 92px);
    pointer-events:none;
  }
  #pde-painel .pde-topo h1{margin:0; font-size:1.5rem; font-weight:800; letter-spacing:.3px; position:relative;}
  #pde-painel .pde-topo p{margin:6px 0 0; font-size:.88rem; opacity:.9; position:relative;}
  #pde-painel .pde-bola{display:inline-block; margin-right:8px; font-size:1.4rem; vertical-align:middle;}

  /* ===== TELAS ===== */
  #pde-painel .pde-tela{
    background:var(--branco); border-radius:var(--raio); box-shadow:var(--sombra);
    padding:22px 20px; margin-top:14px; animation:pde-fade .35s ease;
  }
  @keyframes pde-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  #pde-painel .pde-rotulo{
    font-size:.74rem; font-weight:700; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--cyan); margin-bottom:6px;
  }
  #pde-painel h2{margin:0 0 16px; font-size:1.18rem; font-weight:800;}

  /* ===== SELETOR DE ANO ===== */
  #pde-painel .pde-grid-ano{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  @media(max-width:520px){#pde-painel .pde-grid-ano{grid-template-columns:repeat(3,1fr);}}
  #pde-painel .pde-ano{
    border:2px solid var(--cinza); background:#fff; border-radius:12px;
    padding:16px 6px; cursor:pointer; text-align:center; transition:.18s;
    font-weight:700; color:var(--azul);
  }
  #pde-painel .pde-ano:hover{border-color:var(--cyan); transform:translateY(-2px);}
  #pde-painel .pde-ano .num{display:block; font-size:1.7rem; line-height:1; color:var(--verde);}
  #pde-painel .pde-ano .txt{display:block; font-size:.7rem; color:var(--cinza-txt); margin-top:4px;}

  /* ===== SELEÇÃO DE TIME (bandeiras 16:9) ===== */
  #pde-painel .pde-grid-time{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media(max-width:520px){#pde-painel .pde-grid-time{grid-template-columns:repeat(2,1fr);}}
  #pde-painel .pde-time{
    border:3px solid var(--cinza); background:#fff; border-radius:14px;
    padding:0; cursor:pointer; text-align:center; transition:.18s; overflow:hidden;
  }
  #pde-painel .pde-time:hover{border-color:var(--lime); transform:translateY(-3px); box-shadow:0 6px 16px rgba(26,107,42,.18);}
  #pde-painel .pde-time img{
    width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--cinza);
  }
  #pde-painel .pde-time .nome{
    display:block; font-size:.82rem; font-weight:700; padding:8px 4px; color:var(--azul);
  }

  /* ===== PLACAR (bandeiras 16:9) ===== */
  #pde-painel .pde-placar{
    display:flex; align-items:center; justify-content:center; gap:16px;
    background:linear-gradient(135deg,var(--gramado) 0%,var(--gramado-claro) 100%);
    border-radius:16px; padding:16px 14px; color:#fff; margin-bottom:16px;
    box-shadow:inset 0 0 0 4px rgba(255,255,255,.08);
  }
  #pde-painel .pde-placar .lado{text-align:center; flex:1; max-width:170px;}
  #pde-painel .pde-placar .band{
    width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:8px; display:block;
    box-shadow:0 2px 8px rgba(0,0,0,.25); border:2px solid rgba(255,255,255,.5);
  }
  #pde-painel .pde-placar .nm{font-size:.74rem; font-weight:700; margin-top:6px; opacity:.95;}
  #pde-painel .pde-placar .gols{font-size:2.3rem; font-weight:800; line-height:1; margin-top:4px;}
  #pde-painel .pde-placar .vs{font-size:.9rem; font-weight:700; opacity:.7; flex-shrink:0;}
  #pde-painel .pde-fase-tag{
    text-align:center; font-size:.72rem; font-weight:700; text-transform:uppercase;
    letter-spacing:1px; color:var(--cyan); margin-bottom:4px;
  }

  /* ===== PERGUNTA ===== */
  #pde-painel .pde-disc{
    display:inline-block; font-size:.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.8px; padding:4px 10px; border-radius:20px; margin-bottom:12px;
    background:var(--cinza); color:var(--azul);
  }
  #pde-painel .pde-pergunta{font-size:1.12rem; font-weight:700; line-height:1.4; margin-bottom:18px; color:var(--azul);}
  #pde-painel .pde-alts{display:flex; flex-direction:column; gap:10px;}
  #pde-painel .pde-alt{
    border:2px solid var(--cinza); background:#fff; border-radius:12px;
    padding:14px 16px; cursor:pointer; transition:.15s; font-size:1rem;
    text-align:left; color:var(--azul); font-weight:600;
    display:flex; align-items:center; gap:12px;
  }
  #pde-painel .pde-alt .letra{
    flex-shrink:0; width:28px; height:28px; border-radius:8px;
    background:var(--azul); color:#fff; font-weight:800;
    display:flex; align-items:center; justify-content:center; font-size:.85rem;
  }
  #pde-painel .pde-alt:hover:not(.travado){border-color:var(--cyan); background:#f4fafd;}
  #pde-painel .pde-alt.certo{border-color:var(--gol); background:#eaf6ec;}
  #pde-painel .pde-alt.certo .letra{background:var(--gol);}
  #pde-painel .pde-alt.errado{border-color:var(--erro); background:#fbeaea;}
  #pde-painel .pde-alt.errado .letra{background:var(--erro);}
  #pde-painel .pde-alt.travado{cursor:default;}

  /* ===== FEEDBACK ===== */
  #pde-painel .pde-feedback{margin-top:16px; padding:14px 16px; border-radius:12px; font-size:.95rem; display:none; line-height:1.45;}
  #pde-painel .pde-feedback.gol{background:#eaf6ec; border-left:4px solid var(--gol); display:block;}
  #pde-painel .pde-feedback.fora{background:#fbeaea; border-left:4px solid var(--erro); display:block;}
  #pde-painel .pde-feedback strong{display:block; margin-bottom:3px; font-size:1rem;}

  /* ===== BOTÕES ===== */
  #pde-painel .pde-btn{
    border:none; border-radius:12px; padding:14px 24px; font-size:1rem; font-weight:800;
    cursor:pointer; transition:.18s; font-family:inherit; display:inline-flex;
    align-items:center; gap:8px; justify-content:center;
  }
  #pde-painel .pde-btn-primario{background:var(--verde); color:#fff; width:100%;}
  #pde-painel .pde-btn-primario:hover{background:#155c24; transform:translateY(-1px);}
  #pde-painel .pde-acao{margin-top:18px; display:none;}

  /* ===== PROGRESSO ===== */
  #pde-painel .pde-prog{display:flex; align-items:center; gap:8px; font-size:.78rem; color:var(--cinza-txt); margin-bottom:14px; font-weight:600;}
  #pde-painel .pde-prog .barra{flex:1; height:7px; background:var(--cinza); border-radius:4px; overflow:hidden;}
  #pde-painel .pde-prog .barra i{display:block; height:100%; background:linear-gradient(90deg,var(--cyan),var(--lime)); width:0; transition:width .4s ease;}

  /* ===== FIM ===== */
  #pde-painel .pde-fim{text-align:center;}
  #pde-painel .pde-fim .resultado{font-size:1.4rem; font-weight:800; margin:8px 0;}
  #pde-painel .pde-fim .troféu{font-size:3.4rem; line-height:1;}
  #pde-painel .pde-fim .resumo{background:var(--cinza); border-radius:12px; padding:14px; margin:14px 0; font-size:.95rem; color:var(--azul); line-height:1.7;}
  #pde-painel .pde-fim .resumo img{width:64px; aspect-ratio:16/9; object-fit:cover; border-radius:5px; vertical-align:middle; margin:0 4px; box-shadow:0 1px 4px rgba(0,0,0,.2);}
  #pde-painel .pde-creditos{text-align:center; font-size:.72rem; color:var(--cinza-txt); margin-top:18px;}
  #pde-painel .esconde{display:none !important;}
</style>
</head>
<body>
<div id="pde-painel">

  <div class="pde-topo">
    <h1><span class="pde-bola">⚽</span>Copa do Conhecimento</h1>
    <p>Quiz das Seleções • Anos Iniciais • alinhado à BNCC</p>
  </div>

  <div class="pde-tela" id="tela-ano">
    <div class="pde-rotulo">Passo 1 de 2</div>
    <h2>Qual turma vai jogar hoje?</h2>
    <div class="pde-grid-ano" id="grid-ano"></div>
  </div>

  <div class="pde-tela esconde" id="tela-time">
    <div class="pde-rotulo">Passo 2 de 2</div>
    <h2>Escolha a seleção do seu time</h2>
    <div class="pde-grid-time" id="grid-time"></div>
  </div>

  <div class="pde-tela esconde" id="tela-jogo">
    <div class="pde-fase-tag" id="fase-tag">Fase de Grupos</div>
    <div class="pde-placar">
      <div class="lado">
        <img class="band" id="pl-band-time" alt="">
        <div class="nm" id="pl-nm-time">Você</div>
        <div class="gols" id="pl-gols-time">0</div>
      </div>
      <div class="vs">×</div>
      <div class="lado">
        <img class="band" id="pl-band-adv" alt="">
        <div class="nm" id="pl-nm-adv">Adversário</div>
        <div class="gols" id="pl-gols-adv">0</div>
      </div>
    </div>

    <div class="pde-prog">
      <span id="prog-txt">Pergunta 1</span>
      <span class="barra"><i id="prog-barra"></i></span>
    </div>

    <span class="pde-disc" id="q-disc">Matemática</span>
    <div class="pde-pergunta" id="q-texto">...</div>
    <div class="pde-alts" id="q-alts"></div>
    <div class="pde-feedback" id="q-feedback"></div>
    <div class="pde-acao" id="acao-prox">
      <button class="pde-btn pde-btn-primario" data-action="proxima">Próxima jogada ⚽</button>
    </div>
  </div>

  <div class="pde-tela esconde pde-fim" id="tela-fim">
    <div class="troféu" id="fim-icone">🏆</div>
    <div class="resultado" id="fim-titulo"></div>
    <div class="resumo" id="fim-resumo"></div>
    <button class="pde-btn pde-btn-primario" data-action="reiniciar">Jogar de novo ⚽</button>
  </div>

  <div class="pde-creditos">Portal do Educador • NEWPC Connect</div>
</div>

      {d:"Português",p:"Na frase 'Embora chovesse, o jogo continuou', a palavra 'embora' indica:",alts:["Causa","Oposição/concessão","Tempo"],c:1,exp:"'Embora' introduz uma ideia de concessão (apesar de algo)."},
      {d:"Geografia",p:"A Copa de 2026 reunirá seleções de vários continentes. Quantos continentes habitados existem?",alts:["5","6","7"],c:1,exp:"São 6 continentes habitados: América, Europa, Ásia, África, Oceania e Antártida (sem população fixa)."},
      {d:"Ciências",p:"Durante o exercício intenso, os músculos precisam de mais oxigênio. Quem leva o oxigênio até eles?",alts:["O sangue","A saliva","Os ossos"],c:0,exp:"O sangue transporta o oxigênio dos pulmões até os músculos."},
      {d:"Matemática",p:"Um jogo começou às 16h30 e durou 1h45. A que horas terminou?",alts:["17h15","18h00","18h15"],c:2,exp:"16h30 + 1h45 = 18h15."},
      {d:"Português",p:"Qual palavra é sinônimo de 'vitória'?",alts:["Derrota","Triunfo","Empate"],c:1,exp:"'Triunfo' tem o mesmo sentido de vitória."}
    ]
  };

  var estado = {ano:null, time:null, adversario:null, questoes:[], idx:0, golsTime:0, golsAdv:0, respondeu:false};
  function $(id){return document.getElementById(id);}

  var labelsAno = ["1º","2º","3º","4º","5º"];
  (function montarAnos(){
    var g = $("grid-ano"); var html="";
    for(var i=0;i<5;i++){
      html += '<div class="pde-ano" data-action="escolheAno" data-ano="'+(i+1)+'">'+
              '<span class="num">'+labelsAno[i]+'</span><span class="txt">ano</span></div>';
    }
    g.innerHTML = html;
  })();

  (function montarTimes(){
    var g = $("grid-time"); var html="";
    for(var i=0;i<TIMES.length;i++){
      html += '<div class="pde-time" data-action="escolheTime" data-i="'+i+'">'+
              '<img src="'+img(TIMES[i].nome)+'" alt="Bandeira '+TIMES[i].nome+'">'+
              '<span class="nome">'+TIMES[i].nome+'</span></div>';
    }
    g.innerHTML = html;
  })();

  function embaralha(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }

  function mostraTela(id){
    var telas = ["tela-ano","tela-time","tela-jogo","tela-fim"];
    for(var i=0;i<telas.length;i++){
      var el = $(telas[i]);
      if(telas[i]===id) el.classList.remove("esconde"); else el.classList.add("esconde");
    }
    reportarAltura();
  }

  function escolheAno(ano){ estado.ano = parseInt(ano,10); mostraTela("tela-time"); }

  function escolheTime(i){
    estado.time = TIMES[i];
    estado.adversario = ADVERSARIOS[Math.floor(Math.random()*ADVERSARIOS.length)];
    iniciarJogo();
  }

  function iniciarJogo(){
    estado.questoes = embaralha(BANCO[estado.ano]);
    estado.idx = 0; estado.golsTime = 0; estado.golsAdv = 0; estado.respondeu = false;
    $("pl-band-time").src = img(estado.time.nome);
    $("pl-nm-time").textContent = estado.time.nome;
    $("pl-band-adv").src = img(estado.adversario.nome);
    $("pl-nm-adv").textContent = estado.adversario.nome;
    mostraTela("tela-jogo");
    renderQuestao();
  }

  function renderQuestao(){
    estado.respondeu = false;
    var q = estado.questoes[estado.idx];
    var total = estado.questoes.length;
    var faseIdx = Math.min(Math.floor(estado.idx / Math.ceil(total/FASES.length)), FASES.length-1);
    $("fase-tag").textContent = FASES[faseIdx];
    $("pl-gols-time").textContent = estado.golsTime;
    $("pl-gols-adv").textContent = estado.golsAdv;
    $("prog-txt").textContent = "Pergunta "+(estado.idx+1)+" de "+total;
    $("prog-barra").style.width = ((estado.idx)/total*100)+"%";
    $("q-disc").textContent = q.d;
    $("q-texto").textContent = q.p;
    var html=""; var letras=["A","B","C","D"];
    for(var i=0;i<q.alts.length;i++){
      html += '<button class="pde-alt" data-action="responde" data-i="'+i+'">'+
              '<span class="letra">'+letras[i]+'</span><span>'+q.alts[i]+'</span></button>';
    }
    $("q-alts").innerHTML = html;
    var fb = $("q-feedback"); fb.className="pde-feedback"; fb.style.display="none"; fb.innerHTML="";
    $("acao-prox").style.display = "none";
    reportarAltura();
  }

  function responde(iEscolha){
    if(estado.respondeu) return;
    estado.respondeu = true;
    var i = parseInt(iEscolha,10);
    var q = estado.questoes[estado.idx];
    var botoes = $("q-alts").querySelectorAll(".pde-alt");
    for(var b=0;b<botoes.length;b++){
      botoes[b].classList.add("travado");
      if(b===q.c) botoes[b].classList.add("certo");
    }
    var fb = $("q-feedback");
    if(i===q.c){
      estado.golsTime++;
      fb.className="pde-feedback gol";
      fb.innerHTML = "<strong>⚽ GOL! Resposta certa.</strong>"+q.exp;
    }else{
      botoes[i].classList.add("errado");
      estado.golsAdv++;
      fb.className="pde-feedback fora";
      fb.innerHTML = "<strong>🧤 O adversário marcou.</strong>"+q.exp;
    }
    $("pl-gols-time").textContent = estado.golsTime;
    $("pl-gols-adv").textContent = estado.golsAdv;
    $("prog-barra").style.width = ((estado.idx+1)/estado.questoes.length*100)+"%";
    $("acao-prox").style.display = "block";
    var btnProx = $("acao-prox").querySelector(".pde-btn");
    btnProx.textContent = (estado.idx >= estado.questoes.length-1) ? "Ver resultado 🏆" : "Próxima jogada ⚽";
    reportarAltura();
  }

  function proxima(){
    estado.idx++;
    if(estado.idx >= estado.questoes.length) finalizar(); else renderQuestao();
  }

  function finalizar(){
    var gt = estado.golsTime, ga = estado.golsAdv, total = estado.questoes.length;
    var icone, titulo;
    if(gt > ga){ icone="🏆"; titulo="Campeão! "+estado.time.nome+" venceu!"; }
    else if(gt === ga){ icone="🤝"; titulo="Empate! Foi para os pênaltis do estudo."; }
    else { icone="💪"; titulo="Quase lá! Bora treinar e jogar de novo."; }
    $("fim-icone").textContent = icone;
    $("fim-titulo").textContent = titulo;
    $("fim-resumo").innerHTML =
      "<strong>Placar final</strong><br>"+
      '<img src="'+img(estado.time.nome)+'" alt=""> '+estado.time.nome+" <strong>"+gt+"</strong> × <strong>"+ga+"</strong> "+
      estado.adversario.nome+' <img src="'+img(estado.adversario.nome)+'" alt="">'+
      "<br><br>Você acertou <strong>"+gt+" de "+total+"</strong> perguntas.";
    mostraTela("tela-fim");
  }

  function reiniciar(){ estado.ano=null; estado.time=null; mostraTela("tela-ano"); }

  $("pde-painel").addEventListener("click", function(ev){
    var alvo = ev.target.closest("[data-action]");
    if(!alvo) return;
    var acao = alvo.getAttribute("data-action");
    if(acao==="escolheAno") escolheAno(alvo.getAttribute("data-ano"));
    else if(acao==="escolheTime") escolheTime(alvo.getAttribute("data-i"));
    else if(acao==="responde") responde(alvo.getAttribute("data-i"));
    else if(acao==="proxima") proxima();
    else if(acao==="reiniciar") reiniciar();
  });

  function reportarAltura(){
    requestAnimationFrame(function(){
      var painel = $("pde-painel");
      var altura = painel.getBoundingClientRect().height + 20;
      try{ window.parent.postMessage({tipo:"pde-altura", altura:Math.ceil(altura)}, "*"); }catch(e){}
    });
  }
  window.addEventListener("load", reportarAltura);
  window.addEventListener("resize", reportarAltura);

})();
</script>
</body>
</html>
